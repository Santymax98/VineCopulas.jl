name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
env:
  COPULAS_CONTRACT_REV: acefd3495b8729a0276ae406e7fdda264554e879

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Install Copulas.jl contract snapshot
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(
              url="https://github.com/lrnv/Copulas.jl.git",
              rev=ENV["COPULAS_CONTRACT_REV"],
          ))
          Pkg.status()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false


  copulas-main:
    name: Copulas.jl main compatibility
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install current Copulas.jl main
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(
              url="https://github.com/lrnv/Copulas.jl.git",
              rev="main",
          ))
          Pkg.status()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install Copulas.jl contract snapshot
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(
              url="https://github.com/lrnv/Copulas.jl.git",
              rev=ENV["COPULAS_CONTRACT_REV"],
          ))
          Pkg.status()
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.add(PackageSpec(
              url="https://github.com/lrnv/Copulas.jl.git",
              rev=ENV["COPULAS_CONTRACT_REV"],
          ))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - name: Clean Vitepress artifacts
        run: |
          rm -rf docs/node_modules docs/package-lock.json docs/build
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using VineCopulas
          DocMeta.setdocmeta!(VineCopulas, :DocTestSetup, :(using VineCopulas); recursive=true)
          doctest(VineCopulas)
